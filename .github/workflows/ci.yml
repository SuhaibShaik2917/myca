name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myca
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://app_service_user:secret@localhost:5432/myca
      DATABASE_WORKER_URL: postgresql://worker_service_user:secret@localhost:5432/myca
      DATABASE_WORKER_1_URL: postgresql://worker_service_user_1:secret@localhost:5432/myca
      DATABASE_WORKER_2_URL: postgresql://worker_service_user_2:secret@localhost:5432/myca
      DB_ADMIN_URL: postgresql://postgres:postgrespassword@localhost:5432/myca
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/myca
      STATUTORY_AUDIT_SIGNING_KEY: "MYCA_CI_TEST_STATUTORY_AUDITOR_HMAC_SECRET_v1.0.6_MIN32CHAR"
      SECRET_KEY: "myca_jwt_test_secret_key_minimum_32_characters_long_for_security"
      ENVIRONMENT: development
      ALLOW_DEMO_TOKENS: "true"
      ALLOW_DISPOSABLE_DATABASE_ROLLBACK: "true"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install Python Dependencies
        run: pip install -r requirements.txt
      - name: Compile Python Application
        run: python -m compileall -q app
      - name: Verify Routes
        run: python -c "from app.main import app; print(len(app.routes))"
      - name: Apply Migrations & Provision Role Passwords
        run: |
          alembic upgrade head
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d myca -c "ALTER ROLE app_service_user WITH PASSWORD 'secret'; ALTER ROLE worker_service_user WITH PASSWORD 'secret'; ALTER ROLE worker_service_user_1 WITH PASSWORD 'secret'; ALTER ROLE worker_service_user_2 WITH PASSWORD 'secret';"
      - name: Run CI Database & Role Diagnostics
        run: python scripts/diagnose_ci_database.py
      - name: Execute Full Pytest Suite
        run: python -m pytest tests/ -v --tb=short
      - name: Create Disposable Database for Migration Rollback
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS myca_test;" -c "CREATE DATABASE myca_test WITH TEMPLATE myca;"
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d myca_test -c "CREATE TABLE IF NOT EXISTS public.disposable_database_marker (marker_token text PRIMARY KEY, purpose text NOT NULL, created_at timestamptz NOT NULL DEFAULT clock_timestamp()); INSERT INTO public.disposable_database_marker (marker_token, purpose) VALUES ('MYCA_VERIFIED_DISPOSABLE_TEST_DATABASE_TOKEN_V1_0_17', 'DISPOSABLE_MIGRATION_ROLLBACK_VERIFICATION') ON CONFLICT DO NOTHING;"
      - name: Verify Migration Rollback & Baseline Provenance
        run: python scripts/verify_migration_rollback_state.py
        env:
          DB_ADMIN_URL: postgresql://postgres:postgrespassword@localhost:5432/myca_test
          ENVIRONMENT: test
          ALLOW_DISPOSABLE_DATABASE_ROLLBACK: "true"
      - name: Execute Comprehensive RLS Security Audit
        run: python scripts/audit_rls_security_comprehensive.py
